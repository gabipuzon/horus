name: horus-bench
services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: horus
      POSTGRES_PASSWORD: horus
      POSTGRES_DB: horus
    volumes:
      - ./pg_stat.sql:/docker-entrypoint-initdb.d/pg_stat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horus -d horus"]
      interval: 3s
      retries: 10
  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10
  target:
    build:
      context: ..
      dockerfile: bench/target/Dockerfile
  migrate:
    build: ..
    image: horus-bench:local
    entrypoint: ["/usr/local/bin/horus-migrate"]
    environment: &db_env
      HORUS_DB_HOST: postgres
      HORUS_DB_USER: horus
      HORUS_DB_PASSWORD: horus
      HORUS_DB_NAME: horus
    depends_on:
      postgres:
        condition: service_healthy
  horus:
    image: horus-bench:local
    build: ..
    environment:
      <<: *db_env
      HORUS_REDIS_HOST: redis
      HORUS_WORKER_COUNT: ${BENCH_WORKERS:-3}
      HORUS_ALLOW_PRIVATE_TARGETS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      target:
        condition: service_started
